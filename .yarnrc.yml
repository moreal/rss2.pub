nodeLinker: pnpm

# inquirer-toggle (via @fedify/cli) requires ansi-escapes without declaring it.
# The strict pnpm linker refuses phantom dependencies, so declare it here.
packageExtensions:
  # @solidjs/web's public JSX types import csstype without declaring it.
  "@solidjs/web@*":
    dependencies:
      csstype: "^3.2.3"
  inquirer-toggle@*:
    dependencies:
      ansi-escapes: "^7.0.0"
