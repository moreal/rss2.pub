name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: nix develop --command yarn install --immutable

      - name: Validate release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: nix develop --command yarn release:check "$GITHUB_REF_NAME"

      - name: Typecheck
        run: nix develop --command yarn typecheck

      - name: Solid lint
        run: nix develop --command yarn lint:solid

      # The unit tests catch a stale *compiled* catalog, but only re-running
      # extraction proves the .po files still match the descriptor table.
      - name: Message catalogs are up to date
        run: |
          nix develop --command yarn i18n:extract
          nix develop --command yarn i18n:compile
          git diff --exit-code -- src/web/locales \
            || { echo "::error::Run 'yarn i18n:extract && yarn i18n:compile' and commit src/web/locales."; exit 1; }

      - name: Unit tests
        run: nix develop --command yarn test:unit

      - name: E2E tests
        run: nix develop --command yarn test:e2e

      - name: Install Playwright Chromium
        run: nix develop --command yarn playwright install --with-deps chromium

      - name: UI E2E tests
        run: nix develop --command yarn test:ui

      - name: Build Storybook
        run: nix develop --command yarn storybook:build
